<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chicken Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #c4a574; }
      #game { width: 100%; height: 100%; }
      .keyboard {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font: 14px/1.5 'Helvetica Neue', sans-serif;
        border-radius: 6px;
        z-index: 1;
        pointer-events: none;
      }
    </style>
    <script src="./lib/kinetic.min.js"></script>
  </head>
  <body>
    <div class="keyboard">
      arrow keys move &nbsp;·&nbsp; space peck
    </div>
    <div id="game"></div>

    <script>
      var util = {
        getRadians: function(direction) {
          return Math.PI * 2 / (8 / direction) - Math.PI / 2;
        },

        isOutOfBounds: function(size, left, top, maxX, maxY) {
          if (left <= 0) return [true, 0, top];
          if (top <= 0) return [true, left, 0];
          if (left + size >= maxX) return [true, maxX - size, top];
          if (top + size >= maxY) return [true, left, maxY - size];
          return [false, left, top];
        }
      };

      var getAnimArray = function(animationDefs, ClassName, imgSize) {
        ClassName.animations = {};

        ClassName.directions = [
          'n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'
        ];

        var directionsAlpha = [
          'e', 'n', 'ne', 'nw', 's', 'se', 'sw', 'w'
        ];

        for (var prop in animationDefs) {
          var animInfo = animationDefs[prop];

          for (var i = 0; i < 8; i++) {
            var direction = directionsAlpha[i];
            var animArray = ClassName.animations[prop + '_' + direction] = [];

            for (var j = 0; j < animInfo.frames; j++) {
              var directionOffset = i * animInfo.frames * imgSize;
              var frameOffset = j * imgSize;

              animArray.push(
                animInfo.start * imgSize + directionOffset + frameOffset,
                0,
                imgSize,
                imgSize
              );
            }
          }
        }
      };

      var Chicken = function(image, x, y) {
        this.picking = false;
        this.lastTime = 0;
        this.moveSpeed = 0.1;

        this.animationDefs = {
          picking: { start: 0, frames: 9 },
          running: { start: 72, frames: 8 },
          hit: { start: 144, frames: 7 }
        };

        this.restPoses = {
          e: { anim: 'running', frame: 2 },
          w: { anim: 'running', frame: 2 }
        };

        getAnimArray(this.animationDefs, this, 64);

        this.chickenObj = new Kinetic.Sprite({
          x: x,
          y: y,
          image: image,
          animation: 'running_n',
          animations: this.animations,
          frameRate: 12,
          frameIndex: 0,
          dir: 0
        });
      };

      Chicken.prototype.setRestPose = function() {
        var dirName = this.directions[this.chickenObj.attrs.dir];
        var pose = this.restPoses[dirName] || { anim: 'picking', frame: 0 };
        var anim = pose.anim + '_' + dirName;

        if (this.chickenObj.getAnimation() !== anim) {
          this.chickenObj.setAnimation(anim);
        }
        this.chickenObj.stop();
        this.chickenObj.frameIndex(pose.frame);
      };

      Chicken.prototype.setAnimForDir = function(action, animate) {
        var anim = action + '_' + this.directions[this.chickenObj.attrs.dir];
        if (this.chickenObj.getAnimation() !== anim) {
          this.chickenObj.setAnimation(anim);
        }
        if (animate) {
          if (!this.chickenObj.isRunning()) {
            this.chickenObj.start();
          }
        } else {
          this.chickenObj.stop();
          this.chickenObj.frameIndex(0);
        }
      };

      Chicken.prototype.update = function(time, stageWidth, stageHeight, playerDir) {
        if (this.lastTime === 0) {
          this.lastTime = time;
          return;
        }

        if (this.picking) {
          this.setAnimForDir('picking', true);
        } else if (playerDir !== null) {
          this.chickenObj.attrs.dir = playerDir;
          var timeDiff = time - this.lastTime;
          var radians = util.getRadians(playerDir);
          var pos = this.chickenObj.getPosition();
          var newX = pos.x + Math.cos(radians) * timeDiff * this.moveSpeed;
          var newY = pos.y + Math.sin(radians) * timeDiff * this.moveSpeed;
          var bounded = util.isOutOfBounds(64, newX, newY, stageWidth, stageHeight);
          this.chickenObj.setPosition({ x: bounded[1], y: bounded[2] });
          this.setAnimForDir('running', true);
        } else {
          this.setRestPose();
        }
        this.lastTime = time;
      };

      var chicken;
      var stage;
      var layer;
      var keys = { up: false, down: false, left: false, right: false };

      function getDirFromKeys() {
        var up = keys.up && !keys.down;
        var down = keys.down && !keys.up;
        var left = keys.left && !keys.right;
        var right = keys.right && !keys.left;

        if (up) {
          if (left) return 7;
          if (right) return 1;
          return 0;
        }
        if (down) {
          if (left) return 5;
          if (right) return 3;
          return 4;
        }
        if (left) return 6;
        if (right) return 2;
        return null;
      }

      function bindKeys() {
        document.addEventListener('keydown', function(e) {
          switch (e.key) {
            case 'ArrowUp':
              keys.up = true;
              e.preventDefault();
              break;
            case 'ArrowDown':
              keys.down = true;
              e.preventDefault();
              break;
            case 'ArrowLeft':
              keys.left = true;
              e.preventDefault();
              break;
            case 'ArrowRight':
              keys.right = true;
              e.preventDefault();
              break;
            case ' ':
              chicken.picking = true;
              e.preventDefault();
              break;
          }
        });

        document.addEventListener('keyup', function(e) {
          switch (e.key) {
            case 'ArrowUp':
              keys.up = false;
              e.preventDefault();
              break;
            case 'ArrowDown':
              keys.down = false;
              e.preventDefault();
              break;
            case 'ArrowLeft':
              keys.left = false;
              e.preventDefault();
              break;
            case 'ArrowRight':
              keys.right = false;
              e.preventDefault();
              break;
            case ' ':
              chicken.picking = false;
              e.preventDefault();
              break;
          }
        });
      }

      function gameLoop(time) {
        chicken.update(time, stage.getWidth(), stage.getHeight(), getDirFromKeys());
        layer.draw();
        requestAnimationFrame(gameLoop);
      }

      function init() {
        var img = new Image();
        img.onload = function() {
          stage = new Kinetic.Stage({
            container: 'game',
            width: window.innerWidth,
            height: window.innerHeight
          });

          layer = new Kinetic.Layer();
          chicken = new Chicken(
            img,
            window.innerWidth / 2 - 32,
            window.innerHeight / 2 - 32
          );

          layer.add(chicken.chickenObj);
          stage.add(layer);
          chicken.setRestPose();
          layer.draw();

          bindKeys();
          requestAnimationFrame(gameLoop);

          window.addEventListener('resize', function() {
            stage.setSize(window.innerWidth, window.innerHeight);
          });
        };
        img.src = './sprites/chicken/chicken-sprite.png';
      }

      init();
    </script>
  </body>
</html>
